name: Deploy Web SPA

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-web.yml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
      - 'turbo.json'

env:
  AWS_REGION: us-east-1
  DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx turbo lint --filter=@docpost/web
      - run: npx turbo test --filter=@docpost/web
      - run: npx turbo typecheck --filter=@docpost/web

  build-deploy:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build SPA
        env:
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npx turbo build --filter=@docpost/web
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to S3 + invalidate CloudFront
        if: env.DEPLOY_ENABLED == 'true'
        run: |
          aws s3 sync web/dist/ s3://${{ secrets.SPA_BUCKET_NAME }}/ --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
