name: Deploy Workers

on:
  workflow_dispatch:
  # environment.yml (action: up)
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-workers.yml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'workers/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-workers.yml'
      - 'turbo.json'

# Function names come from Parameter Store (/docpost/dev/lambda/<worker>,
# written by infra/envs/dev). Only the role is a secret.
env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        worker: [fanout, delivery, watchdog, ws]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx turbo lint --filter=@docpost/${{ matrix.worker }}
      - run: npx turbo test --filter=@docpost/${{ matrix.worker }}
      - run: npx turbo typecheck --filter=@docpost/${{ matrix.worker }}

  build-deploy:
    needs: lint-test
    # push to main, a manual run on main, or a call from a workflow on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    strategy:
      matrix:
        worker: [fanout, delivery, watchdog, ws]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build worker
        run: npx turbo build --filter=@docpost/${{ matrix.worker }}
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to Lambda
        if: env.DEPLOY_ENABLED == 'true'
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          # Missing parameter = dev is down; the next `up` deploys the worker.
          if ! out="$(aws ssm get-parameter --name "/docpost/${ENVIRONMENT}/lambda/${WORKER}" --query Parameter.Value --output text 2>&1)"; then
            if grep -q ParameterNotFound <<<"$out"; then
              echo "::notice::dev is down (no /docpost/${ENVIRONMENT}/lambda/${WORKER}); nothing to deploy."
              exit 0
            fi
            echo "$out" >&2
            exit 1
          fi
          FUNCTION="$out"
          cd "workers/${WORKER}"
          zip -j function.zip dist/handler.js
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file fileb://function.zip \
            --publish \
            --query 'FunctionArn' --output text
          aws lambda wait function-updated-v2 --function-name "$FUNCTION"
          echo "Deployed ${WORKER} worker to ${FUNCTION}"
