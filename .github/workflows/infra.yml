name: Infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/actions/terraform-dev/**'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/actions/terraform-dev/**'
      - 'turbo.json'

# dev-base and dev share one state bucket and lock table, and dev reads
# dev-base's outputs. Never run two of these at once.
concurrency:
  group: terraform-dev
  cancel-in-progress: false

# Two roles from infra/envs/dev-base/github_terraform.tf:
#   AWS_TERRAFORM_PLAN_ROLE_ARN  read-only, trusted for pull requests and main
#   AWS_TERRAFORM_ROLE_ARN       read-write, trusted only for jobs in the
#                                GitHub environment "dev" (main only)
env:
  AWS_REGION: us-east-1
  TF_VERSION: '1.9'
  TF_INPUT: 'false'
  PLAN_ENABLED: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN != '' }}
  APPLY_ENABLED: ${{ secrets.AWS_TERRAFORM_ROLE_ARN != '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        # dev reads dev-base through terraform_remote_state, so its plan only
        # succeeds once dev-base has been applied.
        environment: [dev-base, dev]
    defaults:
      run:
        working-directory: infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Configure AWS credentials
        if: env.PLAN_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        if: env.PLAN_ENABLED == 'true'
        run: terraform init
      - name: Terraform Validate
        if: env.PLAN_ENABLED == 'true'
        run: terraform validate
      - name: Terraform Plan
        if: env.PLAN_ENABLED == 'true'
        id: plan
        env:
          RDS_MASTER_PASSWORD: ${{ secrets.RDS_MASTER_PASSWORD }}
        run: |
          if [ "${{ matrix.environment }}" = "dev" ] && [ -n "$RDS_MASTER_PASSWORD" ]; then
            export TF_VAR_rds_master_password="$RDS_MASTER_PASSWORD"
          fi
          terraform plan -no-color -out=tfplan
        continue-on-error: true
      - name: Comment PR with plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan - \`${{ matrix.environment }}\`
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  # One job, in order: dev-base first (dev reads its state), then dev.
  # Nothing is applied unless both stacks can be, so the dev -> dev-base
  # migration never stops halfway with an object owned by two states.
  apply:
    needs: plan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # The apply role only trusts this environment. Restrict it to main under
    # Settings -> Environments -> dev -> Deployment branches.
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Apply role not configured
        if: env.APPLY_ENABLED != 'true'
        run: echo "::warning::AWS_TERRAFORM_ROLE_ARN is not set, so nothing is applied. See infra/envs/dev-base/github_terraform.tf."
      - name: Configure AWS credentials
        if: env.APPLY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Apply dev-base, then dev
        if: env.APPLY_ENABLED == 'true'
        uses: ./.github/actions/terraform-dev
        with:
          command: apply
          rds-master-password: ${{ secrets.RDS_MASTER_PASSWORD }}
          terraform-version: ${{ env.TF_VERSION }}
