name: Deploy Auth Service

on:
  push:
    branches: [main]
    paths:
      - 'services/auth/**'
      - 'scripts/ci-deploy-service.sh'
      - 'scripts/db-bootstrap.sh'
      - 'scripts/db-migrate.sh'
      - 'scripts/lib/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-auth.yml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'services/auth/**'
      - 'scripts/ci-deploy-service.sh'
      - 'scripts/db-bootstrap.sh'
      - 'scripts/db-migrate.sh'
      - 'scripts/lib/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-auth.yml'
      - 'turbo.json'
  # Manual redeploy, and environment.yml (action: up) after a rebuild.
  workflow_dispatch:
  workflow_call:

# Cluster, service and repository come from Parameter Store (/docpost/dev/...),
# so a rebuilt dev needs no secret or variable changes. Only the role is a secret.
env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  SERVICE_NAME: auth
  SERVICE_PORT: 3001
  DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx turbo lint --filter=@docpost/${{ env.SERVICE_NAME }}
      - run: npx turbo test --filter=@docpost/${{ env.SERVICE_NAME }}
      - run: npx turbo typecheck --filter=@docpost/${{ env.SERVICE_NAME }}

  build-push:
    needs: lint-test
    # push to main, a manual run on main, or a call from a workflow on main
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        if: env.DEPLOY_ENABLED == 'true'
        id: push
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          REPOSITORY="$(aws ssm get-parameter --name "/docpost/${ENVIRONMENT}/ecr/${SERVICE_NAME}" --query Parameter.Value --output text)"
          IMAGE="$REPOSITORY:$IMAGE_TAG"
          docker build -f "services/${SERVICE_NAME}/Dockerfile" -t "$IMAGE" -t "$REPOSITORY:latest" .
          docker push "$IMAGE"
          docker push "$REPOSITORY:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The teardown layer writes /docpost/dev/ecs_cluster. When it is missing,
      # dev is down: the image is in ECR and the next `up` deploys it.
      - name: Check that dev is up
        if: env.DEPLOY_ENABLED == 'true'
        id: dev
        run: |
          if out="$(aws ssm get-parameter --name "/docpost/${ENVIRONMENT}/ecs_cluster" 2>&1)"; then
            echo "up=true" >> "$GITHUB_OUTPUT"
          elif grep -q ParameterNotFound <<<"$out"; then
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dev is down (no /docpost/${ENVIRONMENT}/ecs_cluster); image pushed, nothing to roll."
          else
            echo "$out" >&2
            exit 1
          fi
      - name: Deploy to ECS
        if: env.DEPLOY_ENABLED == 'true' && steps.dev.outputs.up == 'true'
        run: bash scripts/ci-deploy-service.sh "${SERVICE_NAME}" "${{ needs.build-push.outputs.image }}"
