name: Deploy DocPost API

on:
  push:
    branches: [main]
    paths:
      - 'services/docpost-api/**'
      - 'scripts/ci-deploy-service.sh'
      - 'packages/shared/**'
      - '.github/workflows/deploy-docpost-api.yml'
      - 'turbo.json'
  pull_request:
    branches: [main]
    paths:
      - 'services/docpost-api/**'
      - 'scripts/ci-deploy-service.sh'
      - 'packages/shared/**'
      - '.github/workflows/deploy-docpost-api.yml'
      - 'turbo.json'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ECS_CLUSTER: docpost-dev-cluster
  SERVICE_NAME: docpost-api
  SERVICE_PORT: 3003
  DEPLOY_ENABLED: ${{ secrets.AWS_DEPLOY_ROLE_ARN != '' }}

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx turbo lint --filter=@docpost/${{ env.SERVICE_NAME }}
      - run: npx turbo test --filter=@docpost/${{ env.SERVICE_NAME }}
      - run: npx turbo typecheck --filter=@docpost/${{ env.SERVICE_NAME }}

  build-push:
    needs: lint-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        if: env.DEPLOY_ENABLED == 'true'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        if: env.DEPLOY_ENABLED == 'true'
        id: push
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/docpost/${{ env.SERVICE_NAME }}:$IMAGE_TAG"
          docker build -f services/${{ env.SERVICE_NAME }}/Dockerfile -t "$IMAGE" -t "$ECR_REGISTRY/docpost/${{ env.SERVICE_NAME }}:latest" .
          docker push "$IMAGE"
          docker push "$ECR_REGISTRY/docpost/${{ env.SERVICE_NAME }}:latest"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        if: env.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS
        if: env.DEPLOY_ENABLED == 'true'
        run: bash scripts/ci-deploy-service.sh ${{ env.SERVICE_NAME }} ${{ needs.build-push.outputs.image }}
